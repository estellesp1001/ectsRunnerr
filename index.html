<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  
  <!-- Game title displayed in browser tab -->
  <title>ECTS Runner - University Platformer</title>
  
  <style>
    /* Reset default browser margins and padding */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #0a0f1e;  /* Dark blue background color */
      display: flex;        /* Flexbox for centering */
      justify-content: center;
      align-items: center;
      min-height: 100vh;    /* Full viewport height */
      
      /* font stack for game-like appearance */
      font-family: 'Comic Neue', 'Fredoka One', cursive, 'Courier New', monospace;
      
      /* Custom SVG cursor - a stylized pen/pointer for game menus */
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="27" viewBox="0 0 24 27"><polygon points="2,2 22,13 12,16 2,25" fill="%23FFD700" stroke="%238B4513" stroke-width="2"/><circle cx="13" cy="15" r="4" fill="%23FF4500"/></svg>') 13 15, auto;
    }
    
    canvas {
      display: block;               /* Remove extra spacing below canvas */
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);  /* Shadow effect for depth */
      border-radius: 16px;         /* Rounded corners */
    }
  </style>
  
  <!-- Google Fonts for playful, game-friendly typography -->
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@300;400;700&family=Fredoka+One&display=swap" rel="stylesheet">
  
  <!-- p5.js libraries loaded from local assets folder (offline-capable) -->
  <script src="assets/p5.js"></script>        <!-- p5.js graphics library -->
  <script src="assets/p5.sound.js"></script>  <!-- p5.js sound addon for audio playback -->
</head>
<body>
  <!-- Game script files loaded in order of dependency -->
  <script src="player.js"></script>   <!-- Player character logic and rendering -->
  <script src="world.js"></script>    <!-- World generation, platforms, enemies, coins -->
  <script src="ui.js"></script>       <!-- User interface: ECTS display, hearts, controls -->
  <script src="sketch.js"></script>   <!-- Main game loop, states, transitions, video intro -->
</body>
</html>
