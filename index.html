<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ECTS Runner - Πανεπιστημιακό Platformer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0f1e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Comic Neue', 'Comic Neue', 'Fredoka One', cursive, 'Courier New', monospace;
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="27" viewBox="0 0 24 27"><polygon points="2,2 22,13 12,16 2,25" fill="%23FFD700" stroke="%23FF8C00" stroke-width="2"/><circle cx="12" cy="13" r="3" fill="%23FF4500"/></svg>') 12 13, auto;
    }
    canvas {
      display: block;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border-radius: 16px;
    }
  </style>
  <!-- Google Fonts για παιχνιδιάρικη γραμματοσειρά -->
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@300;400;700&family=Fredoka+One&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.js"></script>
</head>
<body>
  <script src="player.js"></script>
  <script src="world.js"></script>
  <script src="ui.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
